name: SRE Microservices CI/CD

on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:
    branches: ["main", "master", "develop"]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  validate-and-test:
    name: Validate code, Docker Compose, Kubernetes and Terraform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies for all services
        run: |
          python -m pip install --upgrade pip
          for req in services/*/requirements.txt; do
            echo "Installing $req"
            pip install -r "$req"
          done
          pip install ruff pytest

      - name: Lint Python microservices
        run: |
          ruff check services --select F

      - name: Compile Python files
        run: |
          python -m compileall services

      - name: Validate Docker Compose files
        run: |
          docker compose -f docker-compose.yml config > /tmp/docker-compose.rendered.yml
          docker compose -f docker-stack.yml config > /tmp/docker-stack.rendered.yml

      - name: Validate Kubernetes manifests
        uses: azure/setup-kubectl@v4
      - name: Dry-run Kubernetes manifests
        run: |
          kubectl apply --dry-run=client -f k8s/

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Validate Terraform configuration
        run: |
          terraform -chdir=terraform fmt -check
          terraform -chdir=terraform init -backend=false
          terraform -chdir=terraform validate

  build-and-smoke-test:
    name: Build Docker images and run smoke test
    runs-on: ubuntu-latest
    needs: validate-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build all services
        run: |
          docker compose build

      - name: Start application stack
        run: |
          docker compose up -d postgres redis auth-service product-service order-service payment-service notification-service profile-service frontend prometheus grafana

      - name: Run smoke tests
        run: |
          chmod +x scripts/smoke_test.sh
          ./scripts/smoke_test.sh

      - name: Show container logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=120

      - name: Stop application stack
        if: always()
        run: |
          docker compose down -v

  publish-images:
    name: Publish Docker images to GHCR
    runs-on: ubuntu-latest
    needs: build-and-smoke-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - product-service
          - order-service
          - payment-service
          - notification-service
          - profile-service
          - frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image context
        id: image
        run: |
          if [ "${{ matrix.service }}" = "frontend" ]; then
            echo "context=frontend" >> "$GITHUB_OUTPUT"
          else
            echo "context=services/${{ matrix.service }}" >> "$GITHUB_OUTPUT"
          fi
          echo "name=${REGISTRY}/${IMAGE_PREFIX}/${{ matrix.service }}" | tr '[:upper:]' '[:lower:]' >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.image.outputs.context }}
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest

  deploy-template:
    name: Deployment stage template
    runs-on: ubuntu-latest
    needs: publish-images
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Deployment instructions
        run: |
          echo "Images are published to GHCR."
          echo "Connect this stage to your server or Kubernetes cluster by adding secrets such as SSH_HOST, SSH_USER, SSH_KEY, KUBE_CONFIG."
          echo "Example deployment options: docker stack deploy, kubectl apply -f k8s/, or ansible-playbook."
