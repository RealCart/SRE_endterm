version: "3.9"
services:
  frontend:
    image: sre-demo-frontend:latest
    ports: ["8080:80"]
    deploy:
      replicas: 2
      restart_policy: {condition: on-failure}
  auth-service:
    image: sre-demo-auth-service:latest
    environment: [SERVICE_NAME=auth-service, PORT=8001]
    deploy: {replicas: 2, restart_policy: {condition: on-failure}}
  product-service:
    image: sre-demo-product-service:latest
    environment: [SERVICE_NAME=product-service, PORT=8002]
    deploy: {replicas: 2, restart_policy: {condition: on-failure}}
  order-service:
    image: sre-demo-order-service:latest
    environment: [SERVICE_NAME=order-service, PORT=8003, DB_HOST=postgres]
    deploy: {replicas: 2, restart_policy: {condition: on-failure}}
  payment-service:
    image: sre-demo-payment-service:latest
    environment: [SERVICE_NAME=payment-service, PORT=8004]
    deploy: {replicas: 2, restart_policy: {condition: on-failure}}
  notification-service:
    image: sre-demo-notification-service:latest
    environment: [SERVICE_NAME=notification-service, PORT=8005]
    deploy: {replicas: 1, restart_policy: {condition: on-failure}}
  profile-service:
    image: sre-demo-profile-service:latest
    environment: [SERVICE_NAME=profile-service, PORT=8006]
    deploy: {replicas: 1, restart_policy: {condition: on-failure}}
