events {}
http {
  upstream auth { server auth-service:8001; }
  upstream product { server product-service:8002; }
  upstream orders { server order-service:8003; }
  upstream payment { server payment-service:8004; }
  upstream notification { server notification-service:8005; }
  upstream profile { server profile-service:8006; }

  server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
      try_files $uri $uri/ /index.html;
    }

    location /auth/ {
      proxy_pass http://auth/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /products/ {
      proxy_pass http://product/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /orders/ {
      proxy_pass http://orders/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /payments/ {
      proxy_pass http://payment/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /notifications/ {
      proxy_pass http://notification/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /profiles/ {
      proxy_pass http://profile/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}
