global:
  scrape_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: microservices
    metrics_path: /metrics
    static_configs:
      - targets:
          - auth-service:8001
          - product-service:8002
          - order-service:8003
          - payment-service:8004
          - notification-service:8005
          - profile-service:8006
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
