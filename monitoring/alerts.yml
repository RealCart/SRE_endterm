groups:
  - name: sre-alerts
    rules:
      - alert: HighErrorRate
        expr: sum(rate(http_requests_total{status=~"5.."}[2m])) by (service) / sum(rate(http_requests_total[2m])) by (service) > 0.01
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: "High error rate on {{ $labels.service }}"
      - alert: ServiceDown
        expr: service_up == 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "Service {{ $labels.service }} is down"
      - alert: HighLatency
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le, service)) > 0.2
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "p95 latency above 200 ms on {{ $labels.service }}"
